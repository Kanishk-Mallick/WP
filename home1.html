<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Website</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .home {
            background-image: url('https://wallpaperaccess.com/full/983300.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
        }

        .content h1 {
            font-family: 'Georgia', serif;
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        .content h1 span {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #ffcc00;
        }

        .content p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .start {
            background-color: #007BFF;
            color: #fff;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .start:hover {
            background-color: #0056b3;
        }

        .start:active::after {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.5);
            top: 0;
            left: 0;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.6s linear;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <section class="home">
        <div class="content">
            <h1>Welcome to <span>My Blog</span></h1>
            <p>Discover amazing stories and insights.</p>
            <button class="start" onclick="window.location.href='blog.html'">Get Started</button>
        </div>
    </section>
</body>
</html>
