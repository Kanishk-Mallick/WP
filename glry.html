<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: black;
        }
        

        .gallery {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .thumbnail {
            width: 150px;
            height: 100px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .thumbnail:hover {
            transform: scale(1.1);
        }

        #image{
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .content {
            max-width: 80%;
            max-height: 80%;
            margin: auto;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }


    </style>
</head>
<body>

<div class="gallery">
    <img class="thumbnail" src="https://images.pexels.com/photos/1054655/pexels-photo-1054655.jpeg?cs=srgb&dl=pexels-hsapir-1054655.jpg&fm=jpg">
    <img class="thumbnail" src="https://searchengineland.com/wp-content/seloads/2014/08/photos-images-pictures-ss-1920.jpg">
    <img class="thumbnail" src="https://media.istockphoto.com/id/1317323736/photo/a-view-up-into-the-trees-direction-sky.jpg?s=612x612&w=0&k=20&c=i4HYO7xhao7CkGy7Zc_8XSNX_iqG0vAwNsrH1ERmw2Q=">
    <img class="thumbnail" src="https://plus.unsplash.com/premium_photo-1724654643848-ab19f6ec1c79?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8ZG9scGhpbnxlbnwwfHwwfHx8MA%3D%3D">
    <img class="thumbnail" src="https://images.pexels.com/photos/1108099/pexels-photo-1108099.jpeg">
    <img class="thumbnail" src="https://cdn.pixabay.com/photo/2015/01/15/16/17/hands-600497_1280.jpg">
    <img class="thumbnail" src="https://helpx.adobe.com/content/dam/help/en/photoshop/using/convert-color-image-black-white/jcr_content/main-pars/before_and_after/image-before/Landscape-Color.jpg">
</div>

<div id="image">
    <img class="content" id="largeimage" src="">
</div>

<script>

    const thumbnails = document.querySelectorAll('.thumbnail');

    thumbnails.forEach((thumbnail) => {
        thumbnail.addEventListener('click', function() {
            const img = this.src.replace('150x100', '600x400'); 
            open(img);
        });
    });

    function open(img) {
        var image = document.getElementById("image");
        var largeImage = document.getElementById("largeimage");

        image.style.display = "flex";
        largeImage.src = img;
    }

    function close() {
        var image = document.getElementById("image");
        image.style.display = "none";
    }

 
    window.onclick = function(event) {
        var image = document.getElementById("image");
        if (event.target == image) {
            image.style.display = "none";
        }
    }
</script>

</body>
</html>
